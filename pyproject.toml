[project]
name = "group-deadlines-bot"
version = "0.1.0"
description = "Telegram-бот для учёта дедлайнов учебной группы"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20",
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.5,<3",
    "aiohttp-socks>=0.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "ty>=0.0.1a1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",     # длинные строки регулирует форматтер
    "RUF001",   # ambiguous chars в строках — у нас русские строки
    "RUF002",   # то же для docstring
    "RUF003",   # то же для комментариев
]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
