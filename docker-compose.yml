services:
  bot:
    build: .
    image: group-deadlines-bot:latest
    command: sh -c "alembic upgrade head && exec python main.py"
    restart: unless-stopped
    volumes:
      - bot_data:/data
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/bot.db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Vilnius}
      BOT_PROXY_URL: ${BOT_PROXY_URL:-}

volumes:
  bot_data:
